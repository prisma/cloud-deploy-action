name: Deploy to Prisma Cloud
description: Build and deploy your app to Prisma Cloud from GitHub Actions
inputs:
  build-command:
    description: Your build command, run verbatim in both modes; the exact value "none" skips the build phase
    default: npm run build
  install-command:
    description: Empty auto-detects from the lockfile (npm ci or bun install --frozen-lockfile)
    default: ""
  module:
    description: Path to your app's Composer module
    default: module.ts
  mode:
    description: deploy or destroy
    default: deploy
  environment:
    description: Empty derives the environment from the branch (default branch deploys to production, any other branch name becomes the environment)
    default: ""
  stage:
    description: Older name for environment, kept for existing workflows
    default: ""
  prisma-version:
    description: Runs this prisma version via bunx when the repository has no prisma devDependency. Empty refuses to deploy such a repository, since the CLI must match the app's Composer version
    default: ""
  working-directory:
    description: Where install, build, and deploy run
    default: "."
  api-url:
    description: Prisma API base URL for the OIDC credential exchange
    default: https://api.prisma.io
outputs:
  outcome:
    description: succeeded, failed, or skipped-no-credential
  build-id:
    description: The id the action reports its build under
  url:
    description: Public URL of the app's root service after a deploy (empty when none was found)
  urls:
    description: 'JSON map of every deployed service address to its public URL, e.g. {"app":"https://….prisma.build","mail.service":"https://…"}'
  report-path:
    description: Path of the JSON run report the deploy wrote during this run (empty when it wrote none)
runs:
  using: node24
  main: main.mjs
  post: post.mjs
