name: Deploy to Prisma Cloud
description: Build and deploy your app to Prisma Cloud from GitHub Actions
inputs:
  build-command:
    description: Your build command, run verbatim in both modes
    default: npm run build
  install-command:
    description: Empty auto-detects from the lockfile (npm ci or bun install --frozen-lockfile)
    default: ""
  module:
    description: Path to your app's Composer module
    default: module.ts
  mode:
    description: deploy or destroy
    default: deploy
  stage:
    description: Empty derives the stage from the branch (default branch deploys to production, any other branch name becomes the stage)
    default: ""
  composer-version:
    description: The @prisma/composer-cli version the action fetches via npx when the repo has no local bin (0.7.0+); use @prisma/composer for 0.6.x
    default: "0.7.0"
  working-directory:
    description: Where install, build, and deploy run
    default: "."
  api-url:
    description: Prisma API base URL for the OIDC credential exchange
    default: https://api.prisma.io
outputs:
  outcome:
    description: succeeded, failed, or skipped-no-credential
  build-id:
    description: The id the action reports its build under
runs:
  using: node24
  main: main.mjs
  post: post.mjs
