name: Prisma Deploy
description: Build, deploy or destroy with Prisma Composer, and report the attempt (reporting stubbed until the Builds API exists)
inputs:
  build-command:
    description: The repo's full build command, run verbatim (deploy mode only — destroy never builds)
    default: npm run build
  install-command:
    description: Empty = auto-detect from the lockfile (npm ci / bun install --frozen-lockfile)
    default: ""
  module:
    description: Path to the Composer module
    default: module.ts
  mode:
    description: deploy | destroy
    default: deploy
  stage:
    description: Empty = derive (default branch → production, otherwise the branch name)
    default: ""
  composer-version:
    description: Composer CLI version invoked via npx
    default: "0.6.0"
  working-directory:
    description: Where install/build/deploy run
    default: "."
outputs:
  outcome:
    description: succeeded | failed | skipped-no-credential
  build-id:
    description: Stub build id until the Builds API exists
runs:
  using: node24
  main: main.mjs
  post: post.mjs
