name: ci

on:
  push:
  pull_request:
  # A new prisma release can break the action without any change here, so the
  # newest CLIs are checked on a schedule too. Failures go to Slack.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [prisma-released]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Match runs.using in action.yml.
          node-version: 24
      - name: Syntax-check the action scripts
        # node --check reads only its first argument, so one invocation per file.
        run: |
          node --check main.mjs
          node --check post.mjs
          node --check credentials.mjs
      - name: Unit-test the action scripts
        run: node --test tests/*.test.mjs
      - name: Sanity-check action.yml
        run: |
          node -e '
            const { readFileSync, existsSync } = require("node:fs");
            const src = readFileSync("action.yml", "utf8");
            const checks = [
              ["name: Deploy to Prisma Cloud", /^name: Deploy to Prisma Cloud$/m],
              ["runs.using: node24", /^  using: node24$/m],
              ["runs.main: main.mjs", /^  main: main\.mjs$/m],
              ["runs.post: post.mjs", /^  post: post\.mjs$/m],
            ];
            for (const name of ["build-command", "install-command", "module", "mode", "environment", "stage", "prisma-version", "working-directory", "api-url"]) {
              checks.push([`input ${name}`, new RegExp(`^  ${name}:$`, "m")]);
            }
            for (const name of ["outcome", "build-id", "url", "urls"]) {
              checks.push([`output ${name}`, new RegExp(`^  ${name}:$`, "m")]);
            }
            const missing = checks.filter(([, re]) => !re.test(src)).map(([what]) => what);
            for (const file of ["main.mjs", "post.mjs"]) {
              if (!existsSync(file)) missing.push(`referenced file ${file}`);
            }
            if (missing.length > 0) {
              console.error(`action.yml sanity check failed, missing: ${missing.join(", ")}`);
              process.exit(1);
            }
            console.log("action.yml sanity check passed");
          '

  prisma-cli:
    name: prisma ${{ matrix.prisma }} accepts the action's arguments
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # rc.29 is the last CLI that takes --stage. latest and dev are npm
        # dist-tags, so a scheduled run tests each new release.
        prisma: [8.0.0-rc.29, 8.0.0-rc.33, latest, dev]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install prisma@${{ matrix.prisma }}
        run: npm install --prefix "$RUNNER_TEMP/prisma" --no-save --no-package-lock "prisma@${{ matrix.prisma }}"
      - name: Run the action's arguments against the CLI
        env:
          PRISMA_CLI_BINS: ${{ runner.temp }}/prisma/node_modules/.bin/prisma
        run: node --test tests/prisma-cli.test.mjs

  e2e:
    name: The action deploys a real app with prisma ${{ matrix.prisma }}
    # Pull requests from forks get no secrets. Branch pushes are covered by
    # their pull request.
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # pinned is the version in e2e/app's lockfile; latest moves the app to
        # prisma@latest and the Composer version it bundles.
        prisma: [pinned, latest]
    permissions:
      contents: read
      # The sweep reads whether the run that made an environment has finished.
      actions: read
    env:
      ENVIRONMENT: e2e-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.prisma }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Move the app to prisma@latest and its Composer version
        if: matrix.prisma == 'latest'
        working-directory: e2e/app
        run: |
          prisma=$(npm view prisma@latest version)
          composer=$(npm view "prisma@$prisma" dependencies.@prisma/composer-cli)
          echo "prisma $prisma, Composer $composer"
          exact='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if ! [[ $prisma =~ $exact && $composer =~ $exact ]]; then
            echo "::error::could not resolve exact versions from npm: prisma \"$prisma\", Composer \"$composer\""
            exit 1
          fi
          npm pkg set "devDependencies.prisma=$prisma" "dependencies.@prisma/composer=$composer" "dependencies.@prisma/composer-prisma-cloud=$composer"
          bun install
      - name: Deploy with the action
        id: deploy
        uses: ./
        timeout-minutes: 15
        env:
          PRISMA_SERVICE_TOKEN: ${{ secrets.PRISMA_SERVICE_TOKEN }}
        with:
          working-directory: e2e/app
          build-command: bun run build
          environment: ${{ env.ENVIRONMENT }}
      - name: Check the action's outputs and the deployed service
        env:
          OUTCOME: ${{ steps.deploy.outputs.outcome }}
          URL: ${{ steps.deploy.outputs.url }}
          URLS: ${{ steps.deploy.outputs.urls }}
          REPORT_PATH: ${{ steps.deploy.outputs.report-path }}
        timeout-minutes: 5
        run: node e2e/verify.mjs
      - name: Destroy the environment
        if: always() && steps.deploy.outcome != 'skipped' && steps.deploy.outputs.outcome != 'skipped-no-credential'
        working-directory: e2e/app
        timeout-minutes: 10
        env:
          PRISMA_SERVICE_TOKEN: ${{ secrets.PRISMA_SERVICE_TOKEN }}
          PRISMA_WORKSPACE_ID: ${{ vars.PRISMA_WORKSPACE_ID }}
        run: bun scripts/destroy.ts
      - name: Destroy environments earlier runs left behind
        if: always() && steps.deploy.outcome != 'skipped' && steps.deploy.outputs.outcome != 'skipped-no-credential'
        working-directory: e2e/app
        timeout-minutes: 10
        env:
          PRISMA_SERVICE_TOKEN: ${{ secrets.PRISMA_SERVICE_TOKEN }}
          PRISMA_WORKSPACE_ID: ${{ vars.PRISMA_WORKSPACE_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/sweep.ts

  report-failure:
    name: Report a failure on main, a scheduled, manual or prisma-released run to Slack
    needs: [check, prisma-cli, e2e]
    # failure() misses a needed job that was cancelled or lost its runner.
    if: >-
      always() &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Post to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEXT: >-
            :rotating_light: prisma/cloud-deploy-action CI failed on a ${{ github.event_name }} run of ${{ github.ref_name }}
            (check: ${{ needs.check.result }}, prisma CLI arguments: ${{ needs.prisma-cli.result }}, end-to-end deploy: ${{ needs.e2e.result }}).
            Deploys that use the action may be broken.
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::error::the SLACK_WEBHOOK_URL secret is not set, so this failure was not reported"
            exit 1
          fi
          jq -n --arg text "$TEXT" '{text: $text}' |
            curl --fail-with-body --silent --show-error -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"
